version: '3.9'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: civicconnect_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicconnect
      POSTGRES_PASSWORD: civicconnect_pass
      POSTGRES_DB: civicconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: civicconnect_api
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
